<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d041a" />
      <stop offset="45%" stop-color="#1b0d36" />
      <stop offset="85%" stop-color="#2c1654" />
      <stop offset="100%" stop-color="#120524" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="50%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72efdd" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo do Banner -->
  <rect width="1200" height="420" rx="24" fill="url(#bannerBg)" />
  <rect width="1180" height="400" x="10" y="10" rx="18" fill="none" stroke="#ffb703" stroke-width="2" opacity="0.35" />

  <!-- Detalhes de Grid e Som de Fundo -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- Ondas Sonoras ao Fundo -->
  <path d="M 0,260 Q 150,180 300,260 T 600,260 T 900,260 T 1200,260" fill="none" stroke="url(#cyanNeon)" stroke-width="3" opacity="0.25" filter="url(#bannerGlow)" />
  <path d="M 0,280 Q 180,340 360,280 T 720,280 T 1080,280 T 1200,280" fill="none" stroke="#ff007f" stroke-width="2.5" opacity="0.25" filter="url(#bannerGlow)" />

  <!-- Lado Esquerdo: Microfone e Logo -->
  <g transform="translate(140, 195) scale(0.95)">
    <!-- Círculos de Som -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#cyanNeon)" stroke-width="2" stroke-dasharray="14 10" opacity="0.4" />
    <circle cx="0" cy="0" r="85" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.6" filter="url(#bannerGlow)" />

    <!-- Microfone Rotacionado -->
    <g transform="rotate(-28)">
      <rect x="-24" y="-75" width="48" height="68" rx="24" fill="url(#gold)" filter="url(#bannerGlow)" />
      <line x1="-20" y1="-55" x2="20" y2="-55" stroke="#1a1033" stroke-width="2.5" stroke-linecap="round" />
      <line x1="-22" y1="-42" x2="22" y2="-42" stroke="#1a1033" stroke-width="2.5" stroke-linecap="round" />
      <line x1="-20" y1="-28" x2="20" y2="-28" stroke="#1a1033" stroke-width="2.5" stroke-linecap="round" />
      <rect x="-28" y="-7" width="56" height="10" rx="3" fill="#ffffff" />
      <polygon points="-22,3 22,3 14,75 -14,75" fill="#1b0d36" stroke="url(#gold)" stroke-width="3" />
      <rect x="-6" y="20" width="12" height="20" rx="3" fill="url(#cyanNeon)" />
      <rect x="-10" y="75" width="20" height="15" rx="3" fill="#ffb703" />
    </g>
  </g>

  <!-- Lado Direito: Tipografia e Destaques -->
  <g transform="translate(360, 0)">
    <!-- Badge de Categoria -->
    <rect x="0" y="72" width="270" height="34" rx="17" fill="rgba(255, 183, 3, 0.15)" stroke="#ffb703" stroke-width="1.5" />
    <text x="135" y="94" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#ffb703">
      WEBRTC • MULTI-DEVICE • SCORE
    </text>

    <!-- Título Principal -->
    <text x="0" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="2" fill="#ffffff">
      VIDEOKÊ <tspan fill="url(#gold)">LIVE</tspan>
    </text>

    <!-- Subtítulo / Slogan -->
    <text x="0" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#d8c8f8">
      Transforme celulares em microfones sem fio e qualquer TV em Videokê real.
    </text>
    <text x="0" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="#a48fd4">
      Vídeos do YouTube, transmissão de voz P2P de baixíssima latência e pontuação com análise de voz.
    </text>

    <!-- Pílulas de Recursos Tecnológicos -->
    <g transform="translate(0, 275)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="170" height="42" rx="10" fill="rgba(255,255,255,0.06)" stroke="#80ed99" stroke-width="1.5" />
      <text x="85" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#80ed99">🎤 Zero Apps / QR Code</text>

      <!-- Pill 2 -->
      <rect x="185" y="0" width="170" height="42" rx="10" fill="rgba(255,255,255,0.06)" stroke="#72efdd" stroke-width="1.5" />
      <text x="270" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#72efdd">⚡ WebRTC Áudio P2P</text>

      <!-- Pill 3 -->
      <rect x="370" y="0" width="170" height="42" rx="10" fill="rgba(255,255,255,0.06)" stroke="#ffb703" stroke-width="1.5" />
      <text x="455" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffb703">⭐ Pontuação de Voz</text>

      <!-- Pill 4 -->
      <rect x="555" y="0" width="160" height="42" rx="10" fill="rgba(255,255,255,0.06)" stroke="#ff007f" stroke-width="1.5" />
      <text x="635" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ff007f">📺 Smart TVs / HDMI</text>
    </g>
  </g>

  <!-- Notas decorativas -->
  <text x="1100" y="110" font-size="34" fill="#ffb703" opacity="0.6">♪</text>
  <text x="1050" y="190" font-size="44" fill="#72efdd" opacity="0.5">♫</text>
  <text x="1130" y="320" font-size="28" fill="#80ed99" opacity="0.6">★</text>
</svg>
