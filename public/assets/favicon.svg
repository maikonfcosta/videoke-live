<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#150a28" />
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="#ffb703" stroke-width="1.5" opacity="0.6" />
  
  <!-- Microfone simplificado e legível em tamanho pequeno -->
  <g transform="translate(32, 28) rotate(-22) translate(-32, -28)">
    <!-- Cápsula -->
    <rect x="25" y="12" width="14" height="19" rx="7" fill="url(#favGold)" />
    <!-- Anel -->
    <rect x="24" y="31" width="16" height="3" rx="1" fill="#f5ecff" />
    <!-- Cabo -->
    <polygon points="26,34 38,34 36,49 28,49" fill="#2a1b4d" stroke="#ffb703" stroke-width="1.5" />
    <!-- Botão -->
    <circle cx="32" cy="40" r="1.5" fill="#72efdd" />
  </g>
  <!-- Nota musical neon -->
  <text x="44" y="20" font-size="14" fill="#80ed99" font-weight="bold">♪</text>
</svg>
